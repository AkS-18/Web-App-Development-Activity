<!DOCTYPE html>
<html>

<head>
    <title>IPL Ticket Booking</title>
</head>

<body>

    <h1>IPL Ticket Booking Form</h1>
    <p>Fill in the details below to book your IPL tickets.</p>

    <form action="#" method="post">

        <label for="name">Full Name:</label><br>
        <input type="text" id="name" name="name" placeholder="Enter your full name" required>
        <br><br>

        <label for="email">Email Address:</label><br>
        <input type="email" id="email" name="email" placeholder="Enter your email" required>
        <br><br>

        <label for="mobile">Mobile Number:</label><br>
        <input type="tel" id="mobile" name="mobile" pattern="[0-9]{10}" placeholder="Enter 10-digit mobile number"
            required>
        <br><br>

        <label for="match">Select Match:</label><br>
        <select id="match" name="match" required>
            <option value="">-- Select a Match --</option>
            <option value="RCB vs CSK">RCB vs CSK</option>
            <option value="MI vs KKR">MI vs KKR</option>
            <option value="SRH vs RR">SRH vs RR</option>
            <option value="DC vs PBKS">DC vs PBKS</option>
        </select>
        <br><br>

        <label for="category">Ticket Category:</label><br>
        <select id="category" name="category" required>
            <option value="">-- Select Category --</option>
            <option value="General">General</option>
            <option value="Premium">Premium</option>
            <option value="VIP">VIP</option>
        </select>
        <br><br>

        <label for="tickets">Number of Tickets:</label><br>
        <input type="number" id="tickets" name="tickets" min="1" max="10" required>
        <br><br>

        <label for="date">Booking Date:</label><br>
        <input type="date" id="date" name="date" required>
        <br><br>

        <label>Gender:</label><br>
        <input type="radio" id="male" name="gender" value="Male" required>
        <label for="male">Male</label>

        <input type="radio" id="female" name="gender" value="Female">
        <label for="female">Female</label>

        <input type="radio" id="other" name="gender" value="Other">
        <label for="other">Other</label>
        <br><br>

        <label for="payment">Payment Method:</label><br>
        <select id="payment" name="payment" required>
            <option value="">-- Select Payment Method --</option>
            <option value="UPI">UPI</option>
            <option value="Credit Card">Credit Card</option>
            <option value="Debit Card">Debit Card</option>
            <option value="Net Banking">Net Banking</option>
        </select>
        <br><br>

        <input type="checkbox" id="terms" name="terms" required>
        <label for="terms">I agree to the terms and conditions.</label>
        <br><br>

        <input type="submit" value="Book Tickets">
        <input type="reset" value="Reset Form">

    </form>

</body>

</html>
